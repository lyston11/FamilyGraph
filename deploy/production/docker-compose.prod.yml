# FamilyGraph 线上环境叠加配置（与仓库根 docker-compose.yml 组合使用）
#
# 用途：在 lyston 服务器上与开发环境完全隔离地运行第二套栈，经 Cloudflare
# 隧道以 https://fg.lyston.qzz.io 提供家庭端；系统管理员后台仅经宿主回环 +
# SSH 隧道访问，不进入任何公网 hostname。
#
# 用法（必须在仓库根执行，两个文件一起给）：
#   docker compose -p familygraph-prod \
#     -f docker-compose.yml -f deploy/production/docker-compose.prod.yml up -d
#
# 或直接用 scripts/install-prod-automation.sh（幂等，推荐）。
#
# 隔离要点（与开发环境的差异，逐条对应 prd.md R1–R4）：
#   - 固定项目名 familygraph-prod：卷/网络/容器名前缀确定，不随目录名漂移；
#     与开发环境（裸机 systemd + 宿主目录）无任何共享资源。
#   - api / agent 撤销全部宿主端口发布：线上只有 web 与 admin-web 两个
#     回环入口，8000/8001/8002 在宿主上仍完全属于开发环境。
#   - 镜像标签加 -prod 后缀：避免与 docker-compose.yml 的默认标签混用，
#     也避免 docker builder 缓存把两套产物串起来。
#
# 注意：web / admin-web 的端口用 `!override` 显式替换而非追加，否则会与
# 基文件继承来的端口列表合并（8080/8081 被一并发布）。

name: familygraph-prod

volumes:
  postgres_data:
    name: familygraph-prod_postgres_data

services:
  api:
    image: familygraph-prod-api:0.1.0
    # 等 PostgreSQL healthy 再启动。
    #
    # **注意这只保证「库在监听」，不保证「schema 已就绪」**：api 的启动命令是
    # `alembic upgrade head && python -m app.serve`，而 PostgreSQL 的 schema 由
    # baseline 脚本建立（历史 Alembic 链在 PG 上跑不通）。因此切流时必须**先**
    # 起 postgres、**再**应用 baseline、**最后**起 api；顺序错了 api 会 crash-loop。
    depends_on:
      postgres:
        condition: service_healthy
    # 线上 api 不对宿主发布任何端口：家庭流量经 web 容器反代，内部协议
    # 与 admin 协议只在容器网络内可达（绑定见基文件的静态 IP）。
    ports: !override []

  web:
    image: familygraph-prod-web:0.1.0
    # 家庭端唯一入口：宿主回环 8100，由 Cloudflare 隧道的
    # fg.lyston.qzz.io Public Hostname 直连（不经宿主 nginx）。
    ports: !override
      - "127.0.0.1:8100:80"

  admin-web:
    image: familygraph-prod-admin-web:0.1.0
    # 系统管理员后台：只发布宿主回环 8101，无公网 hostname、无 DNS 记录、
    # 无隧道路由；访问方式为 ssh -L 8101:127.0.0.1:8101 <host>。
    ports: !override
      - "127.0.0.1:8101:80"

  # AC-5：Assistant 与 Steward 分进程。基文件已拆为 `agent-assistant` /
  # `agent-steward`（以及 profile 门控的 `agent-combined`），此处只需覆盖镜像标签。
  #
  # 历史遗留：这里曾定义 `agent:` 服务。基文件拆分后，生产 override 仍声明 `agent`
  # 就会**额外**启一个继承不到任何 environment 的容器（它不匹配基文件的任何服务），
  # 启动即 `AGENT_SERVICE_SECRET is required` 退出，并使发布脚本的「全部 healthy」
  # 校验失败。实测 2026-10-08 发布时就撞上这一点。
  agent-assistant:
    image: familygraph-prod-agent:0.1.0

  agent-steward:
    image: familygraph-prod-agent:0.1.0

  # ---- PostgreSQL 主存储（C9 生产切流）----
  #
  # 与开发环境使用**同一个自建镜像**（pgvector + PGroonga）。选这个镜像而不是
  # `postgres:16`，是因为检索需要两个扩展：
  #   - `pgvector`：语义候选（C6）
  #   - `pgroonga`：中文词法检索。实测 `pg_trgm` 对 CJK 短查询 0/10 命中，
  #     而 PGroonga 10/10 精确；缺它则中文词法退化为无索引 LIKE。
  #
  # 只绑宿主回环：容器网络内 api 用服务名访问，宿主端口仅用于运维与探针。
  # 密码从 env 读（不写入仓库）；未设置时 compose 直接报错而不是用默认弱口令。
  postgres:
    image: familygraph-postgres:pg16-pgvector-pgroonga
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-familygraph}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须在 .env 中提供强随机值}
    ports: !override
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55460}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    # 与 embedding 同一原则：资源硬上限，避免数据库争抢挤垮同机其他服务。
    # 4 核 / 23 GiB 的机器上给 PG 2 核、2 GiB；可用 env 覆盖。
    cpus: "${POSTGRES_CPUS:-2.0}"
    mem_limit: ${POSTGRES_MEMORY:-2g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-familygraph}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
