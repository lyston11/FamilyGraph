# FamilyGraph 开发/部署底座（m0a；V2.1 agent sidecar；09-04 独立系统管理员后台）
#
# 用法：
#   部署：在 .env 提供 SECRET_KEY、AGENT_SERVICE_SECRET 与 ADMIN_JWT_SECRET/
#         ADMIN_JWT_ISSUER/ADMIN_JWT_AUDIENCE（强随机值），然后
#         docker compose up --build -d
#   家庭前端: http://localhost:8080 （/api 经 nginx 反代到 api）
#   家庭 API 健康: http://localhost:8000/api/health
#   系统管理员后台: http://127.0.0.1:8081 （仅宿主回环；VPN/内网反代进入，
#                   /admin-api 经 nginx 反代到 api:8002；初始密码见数据卷
#                   /data/bootstrap/admin-credentials，0600，首改后删除）
#
# 安全合同（P1 收口 + 09-04 隔离）：
#   - 弱默认密钥 fail-closed：SECRET_KEY / AGENT_SERVICE_SECRET / ADMIN_JWT_SECRET
#     未提供即拒启，不提供 dev 弱默认值；开发联调需显式 DEV_ALLOW_WEAK_SECRETS=1。
#   - internal agent 协议（8001）绑定 api 在 backend 网络的接口 IP
#     （INTERNAL_AGENT_API_HOST=172.28.0.10，静态分配），frontend 网络上的
#     web/nginx 与宿主均无法路由到该接口；backend 网络设 internal:true，
#     sidecar 无外网 egress（模型流量经 api 容器的 ProviderGateway 代理转发）。
#   - admin API listener（8002）只绑定 api 在 admin 网络的接口 IP
#     （ADMIN_API_HOST=172.29.0.10，静态分配），不发布宿主端口：家庭 web、
#     公网与宿主均不可直达，唯一入口是 admin-web 的 /admin-api 反代；
#     admin 网络设 internal:true（admin-web 无外网 egress）。

services:
  api:
    build: ./backend
    image: familygraph-api:0.1.0
    restart: unless-stopped
    ports:
      # 仅家庭 listener 发布到宿主；internal（8001）与 admin（8002）不发布端口，
      # 分别只绑定 backend / admin 网络接口（见 INTERNAL_AGENT_API_HOST/ADMIN_API_HOST）
      - "8000:8000"
    environment:
      DATA_DIR: /data
      # fail-closed：未在 .env 提供强随机密钥即拒启（compose 层与 config 层双保险）
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 必须在 .env 中提供强随机值}
      AGENT_SERVICE_SECRET: ${AGENT_SERVICE_SECRET:?AGENT_SERVICE_SECRET 必须在 .env 中提供强随机值}
      DEV_ALLOW_WEAK_SECRETS: ${DEV_ALLOW_WEAK_SECRETS:-0}
      # 09-04 系统管理员：独立 JWT 签发域（与家庭 SECRET_KEY 不同值），缺失/过弱拒启
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET 必须在 .env 中提供强随机值}
      ADMIN_JWT_ISSUER: ${ADMIN_JWT_ISSUER:?ADMIN_JWT_ISSUER 必须在 .env 中提供}
      ADMIN_JWT_AUDIENCE: ${ADMIN_JWT_AUDIENCE:?ADMIN_JWT_AUDIENCE 必须在 .env 中提供}
      # 部署指定的初始/恢复密码；留空则随机生成并写入 0600 凭据文件。
      # 首登强制改密；正常重启不重置既有账号。
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      # V2.1 Agent Runtime：feature flag 与内部协议共享密钥（与 agent 服务一致）
      AGENT_RUNTIME_ENABLED: ${AGENT_RUNTIME_ENABLED:-0}
      # Provider 不绑定任何具体供应商：注册时做结构性校验（base_url 必须是
      # http/https 绝对 URL、协议必须是受支持的 OpenAI 适配器之一、
      # allowed_models 非空）。数据能否离开本机由空间级 cloud_allowed 决定。
      # local Provider 仍可由平台 operator 作为本机端点注册。
      # P1 网络隔离：internal listener 只绑定 backend 网络静态 IP（web/宿主不可路由）
      INTERNAL_AGENT_API_HOST: 172.28.0.10
      # 09-04 网络隔离：admin listener 只绑定 admin 网络静态 IP（web/宿主不可路由）
      ADMIN_API_HOST: 172.29.0.10
      # V2.3 Relationship Intelligence
      RELATIONSHIP_INTELLIGENCE_ENABLED: ${RELATIONSHIP_INTELLIGENCE_ENABLED:-0}
      # V2.6 Controlled Web：平台总开关（默认关闭；空间还需 owner/admin 单独 opt-in）
      CONTROLLED_WEB_ENABLED: ${CONTROLLED_WEB_ENABLED:-0}
      # V2.4 Steward：领域开关 + 进程内 canonical job worker 泵（双开关）
      STEWARD_ENABLED: ${STEWARD_ENABLED:-0}
      STEWARD_WORKER_ENABLED: ${STEWARD_WORKER_ENABLED:-0}
      MAINTENANCE_INTERVAL_SECONDS: ${MAINTENANCE_INTERVAL_SECONDS:-5}
      # 09-11 Steward 生产调度：周期扫描/退避/重跑冷却（正数 + 上界校验，见 config.py）
      STEWARD_SCAN_INTERVAL_SECONDS: ${STEWARD_SCAN_INTERVAL_SECONDS:-300}
      STEWARD_SCAN_MAX_JOBS_PER_TICK: ${STEWARD_SCAN_MAX_JOBS_PER_TICK:-10}
      STEWARD_RETRY_BACKOFF_FIRST_SECONDS: ${STEWARD_RETRY_BACKOFF_FIRST_SECONDS:-5}
      STEWARD_RETRY_BACKOFF_SECOND_SECONDS: ${STEWARD_RETRY_BACKOFF_SECOND_SECONDS:-30}
      STEWARD_RERUN_COOLDOWN_SECONDS: ${STEWARD_RERUN_COOLDOWN_SECONDS:-60}
      # 09-11 发布可观测性：队列积压告警阈值（秒；0=自动=max(2×扫描间隔,60)），
      # 仅产生 /admin-api/v1/steward/status 的可见 alerts，不改变调度行为
      STEWARD_ALERT_QUEUE_SECONDS: ${STEWARD_ALERT_QUEUE_SECONDS:-0}
      # 09-06 Steward 模型辅助平台级开关（有效 = 平台 AND 空间，默认全关）
      STEWARD_ASSIST_CANDIDATE: ${STEWARD_ASSIST_CANDIDATE:-0}
      STEWARD_ASSIST_RANKING: ${STEWARD_ASSIST_RANKING:-0}
      STEWARD_ASSIST_EXPLANATION: ${STEWARD_ASSIST_EXPLANATION:-0}
      # 09-06 Steward 称谓辅助开关；plan 墙钟上界见 STEWARD_ASSIST_BATCH_LEASE_SECONDS
      STEWARD_ASSIST_TERMINOLOGY: ${STEWARD_ASSIST_TERMINOLOGY:-0}
      # 09-25 Steward Pi child run：默认关。开启后 steward 模型辅助由 sidecar
      # 租赁受限 child run 执行。与 STEWARD_ENABLED 双开关（child run 的 lease
      # 端点要求两者皆真）。S5 起 Pi 是**唯一**载体：in-process 直连已删除，
      # 因此本开关关闭时 steward 模型辅助不会执行（而不是回退到另一条路径）。
      STEWARD_PI_RUNTIME_ENABLED: ${STEWARD_PI_RUNTIME_ENABLED:-0}
      # 与 agent 服务同名同值：服务端用它决定放行几个 attempt，sidecar 用它决定
      # 能跑几个。两侧不一致会让 attempt「已预留但无人执行」，直到
      # recover_stuck_attempts 收口。sidecar 也会从 lease 响应读取服务端当前值
      # 作为纠错（只上调不下调），但广播是纠错机制，不替代两侧配置。
      # 默认 2 与 config.py / config.ts 的默认值一致：默认值不同会让两侧在未显式
      # 配置时静默不一致。
      STEWARD_ASSIST_MAX_CONCURRENT_CALLS_PER_SPACE: ${STEWARD_ASSIST_MAX_CONCURRENT_CALLS_PER_SPACE:-2}
      # 10-03 执行面多租户准入：全局与单租户名额 + 有界等待。默认值必须与
      # config.py 一致，否则未显式配置时两侧语义不同。
      # 全局名额必须小于连接池上限（15），为 heartbeat/lease/settle/health 留余量。
      AGENT_EXECUTION_GLOBAL_CAPACITY: ${AGENT_EXECUTION_GLOBAL_CAPACITY:-8}
      AGENT_EXECUTION_PER_TENANT_CAPACITY: ${AGENT_EXECUTION_PER_TENANT_CAPACITY:-2}
      AGENT_EXECUTION_MAX_WAIT_SECONDS: ${AGENT_EXECUTION_MAX_WAIT_SECONDS:-10}
      AGENT_EXECUTION_MAX_QUEUE: ${AGENT_EXECUTION_MAX_QUEUE:-64}
      DEV_SEED_DEMO_DATA: ${DEV_SEED_DEMO_DATA:-0}
      # 09-01 个人家族视图（家庭卡/家族树投影端点）功能开关
      PERSONAL_FAMILY_VIEW_ENABLED: ${PERSONAL_FAMILY_VIEW_ENABLED:-0}
      # 09-13 Memory/RAG：默认关闭；关闭时无候选/检索，工具路径保留
      MEMORY_ENABLED: ${MEMORY_ENABLED:-0}
      RAG_ENABLED: ${RAG_ENABLED:-0}
      # ---- 存储与检索接线（C9 切流用）----
      #
      # 全部用 `${VAR:-}` 形式透传：**空值即回落到 SQLite**
      # （`config.DATABASE_URL` 是 `os.environ.get("DATABASE_URL") or f"sqlite:///{DB_PATH}"`），
      # 因此未配置的部署行为与改动前逐字一致，而配置了的部署无需再改 compose。
      #
      # 必须在基文件里声明：compose 的 `environment` 是白名单，未声明的变量**不会**
      # 从宿主机 env 传入容器——这正是「改了 .env 但容器看不到」的常见原因。
      DATABASE_URL: ${DATABASE_URL:-}
      FG_WRITER_STAGE: ${FG_WRITER_STAGE:-sqlite}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-}
      RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-0}
    volumes:
      # 数据卷：/data/db（SQLite+WAL）、/data/uploads、/data/backups 同卷；
      # /data/bootstrap/admin-credentials（0600 初始凭据）也在此卷
      - app_data:/data
    networks:
      frontend: {}
      backend:
        # 静态 IP：INTERNAL_AGENT_API_HOST 依赖该地址确定 internal 接口
        ipv4_address: 172.28.0.10
      admin:
        # 静态 IP：ADMIN_API_HOST 依赖该地址确定 admin 接口
        ipv4_address: 172.29.0.10
    # 优雅停机：先停止接收新连接，给 uvicorn 时间完成在途请求与 lease 释放
    # （serve.py 共享信号处理器让三个 listener 同时优雅退出）
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Embedding 服务（C6）：本地 CPU 推理，**硬限制**资源。
  #
  # ## 为什么独立服务而不是在 api 进程内加载模型
  #
  # api 是 4 核机器上承载生产与开发的进程。把模型放进 api 意味着：
  # 模型内存计入 api、推理线程与请求处理争抢同一进程、OOM 会一起带走 api。
  # 独立容器让上述三者都被隔离，且能被 cpus/mem_limit 硬限制。
  #
  # ## 资源硬限制（本服务的核心保障）
  #
  # 模型选得小**不等于**不会拖垮服务器；真正的保障是下面这些限制 + 应用层的
  # 有界闸门（`embedding/app/gate.py`）。三层：容器 cpus/mem_limit 是兜底，
  # 进程线程数是第二层，应用层并发/队列是第三层。
  embedding:
    build:
      context: ./embedding
    image: familygraph-embedding:0.1.0
    restart: unless-stopped
    # 不依赖 api：它不需要数据库也不需要 api 启动完成。反向依赖由 api 按需调用。
    environment:
      EMBEDDING_MODEL_NAME: bge-small-zh-v1.5
      EMBEDDING_DIMENSION: "512"
      EMBEDDING_MAX_TOKENS: "512"
      # 并发 1：这台机器同时跑生产与开发，embedding 不能与它们抢核。
      EMBEDDING_MAX_CONCURRENT: "1"
      # 有界队列：满了立即 429（背压），不无限排队。
      EMBEDDING_MAX_WAITING: "8"
      EMBEDDING_WAIT_TIMEOUT_SECONDS: "5"
      EMBEDDING_MAX_TEXTS_PER_REQUEST: "16"
      EMBEDDING_MAX_CHARS_PER_TEXT: "8000"
      EMBEDDING_THREADS: "1"
    networks:
      - backend
    # ---- 硬限制 ----
    # cpus: 1.0 = 最多 1 核等效算力。不是「给数据库留 3 核」的保证，
    #   而是「embedding 最多用 1 核」的保证；主服务是否受影响仍需观测。
    cpus: "1.0"
    mem_limit: 1g
    memswap_limit: 1g
    # 不发布宿主端口：只在 internal 网络内被 api 访问。
    # 不给日志驱动额外配置：默认 json-file 已有上限（见 x-logging 片段）。
    healthcheck:
      # 用 /readyz：它会检查模型是否已加载。用 /healthz 会让「模型加载失败」
      # 显示为健康。
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/readyz',timeout=3).status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      # 模型加载需要时间；start_period 覆盖它，避免启动期被判定不健康而重启
      # （重启会重新加载模型，形成「永远起不来」的循环）。
      start_period: 120s
      retries: 3
    stop_grace_period: 15s

  web:
    build: ./frontend
    image: familygraph-web:0.1.0
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 注意：web 不挂载数据卷——nginx 禁止直挂 uploads，附件下载走后端授权端点

  # 09-04 系统管理员后台前端：独立镜像（system-admin-frontend/），只代理
  # /admin-api 到 api:8002；仅绑定宿主回环 8081，由 VPN/内网反代进入。
  admin-web:
    build:
      # 上下文必须是仓库根：system-admin-frontend/src/styles/main.css 用相对路径
      # @import 仓库根的 shared/brand-tokens.css（R4 设计系统单一定义源）。
      # 用 system-admin-frontend/ 作上下文时该文件在上下文之外，镜像构建必失败。
      context: .
      dockerfile: system-admin-frontend/Dockerfile
    image: familygraph-admin-web:0.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - admin
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # V2.1 Agent sidecar（B2）：无业务 DB、无 uploads 卷、不暴露端口、
  # 无外网 egress（backend 网络 internal:true；模型流量经 api 的 Provider
  # 代理转发，api_key 不出服务端）。
  #
  # ## AC-5：Assistant 与 Steward **分进程**（默认形态）
  #
  # 两个独立服务而不是一个 `role=both`，因为 `both` 时两者共享：
  #
  # - Node event loop（一次长 provider 流的同步工作会拖慢另一类）
  # - HTTP client 与连接池
  # - heap 与 GC 停顿
  # - 重试风暴（一类上游故障时的退避会占满共享资源）
  #
  # 分进程后每类有自己的上述资源，代价是多一个容器与一份基础内存。
  # 需要单进程时（本地开发、极小部署）用 profile `combined`：
  #   docker compose --profile combined up agent-combined
  #
  # 共享的公共片段：两者除角色与槽位外完全一致。
  agent-assistant:
    build: ./agent
    image: familygraph-agent:0.1.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment: &agent_env
      # 公开 base 仅用于 /api/health 探针；internal 协议走独立 listener
      FG_API_BASE_URL: http://api:8000
      # internal agent 协议独立端口（api 容器内，不发布宿主端口，仅 backend
      # internal 网络可达；nginx/浏览器/宿主均无法触达）
      FG_INTERNAL_API_BASE_URL: http://api:8001
      AGENT_SERVICE_SECRET: ${AGENT_SERVICE_SECRET:?AGENT_SERVICE_SECRET 必须在 .env 中提供强随机值}
      AGENT_RUNTIME_ENABLED: ${AGENT_RUNTIME_ENABLED:-0}
      HEALTH_PORT: "8080"
      # 分进程：本实例只服务 assistant。只服务一类时不需要 `both` 的槽位共享。
      FG_AGENT_ROLE: assistant
      # assistant 槽位数：后端每账号最多放行 2 个并发 assistant run，本地更小
      # 只会人为造排队（不改变后端授权，仅影响本地并发）。
      AGENT_MAX_CONCURRENT_RUNS: ${AGENT_MAX_CONCURRENT_RUNS:-2}
      # steward 槽位在本实例不生效（角色不含 steward），但必须仍提供合法值，
      # 否则 sidecar 的配置校验会 fail fast。
      STEWARD_ASSIST_MAX_CONCURRENT_CALLS_PER_SPACE: ${STEWARD_ASSIST_MAX_CONCURRENT_CALLS_PER_SPACE:-2}
    networks:
      - backend
    # 优雅停机：SIGTERM → worker.stop + health.close；在途 Run 由 FastAPI reaper 回收
    stop_grace_period: 10s
    healthcheck: &agent_healthcheck
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  agent-steward:
    build: ./agent
    image: familygraph-agent:0.1.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *agent_env
      # 分进程：本实例只服务 steward（Pi child run 的模型辅助）。
      FG_AGENT_ROLE: steward
    networks:
      - backend
    stop_grace_period: 10s
    healthcheck: *agent_healthcheck

  # 单进程形态：Assistant + Steward 共用（本地开发/极小部署）。
  # 默认**不启动**（profile 门禁），因为共享 event loop 是 AC-5 要消除的形态。
  agent-combined:
    profiles: ["combined"]
    build: ./agent
    image: familygraph-agent:0.1.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *agent_env
      FG_AGENT_ROLE: both
    networks:
      - backend
    stop_grace_period: 10s
    healthcheck: *agent_healthcheck

volumes:
  app_data:

networks:
  frontend:
  # internal：sidecar ↔ api 专用；internal:true 禁止容器访问外网，
  # api 因同时挂在 frontend 网络仍可出网（Provider/Controlled Web egress 唯一出口）
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # admin：admin-web ↔ api 专用。注意：Docker 对 internal 网络会丢弃已发布
  # 端口（admin-web 的 127.0.0.1:8081 发布因此无法生效），故此处不能设
  # internal:true。隔离边界由两点维持：8002 admin listener 只绑定 api 在
  # 本网络的静态 IP（172.29.0.10，不发布宿主端口，家庭 web/宿主/公网均
  # 不可直达）；admin-web 仅发布宿主回环 127.0.0.1:8081。
  admin:
    ipam:
      config:
        - subnet: 172.29.0.0/24
