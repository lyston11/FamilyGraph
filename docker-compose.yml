# FamilyGraph 开发/部署底座（m0a；V2.1 新增 agent sidecar）
#
# 用法：
#   全新克隆：docker compose up --build -d
#   前端:     http://localhost:8080 （/api 经 nginx 反代到 api）
#   API 健康: http://localhost:8000/api/health
#
# 安全提示：下方 SECRET_KEY 默认值仅供本地试用；部署前务必用 .env 或环境变量覆盖。

services:
  api:
    build: ./backend
    image: familygraph-api:0.1.0
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      # V2.1 Agent Runtime：feature flag 与内部协议共享密钥（与 agent 服务一致）
      AGENT_RUNTIME_ENABLED: ${AGENT_RUNTIME_ENABLED:-0}
      AGENT_SERVICE_SECRET: ${AGENT_SERVICE_SECRET:-dev-agent-secret-change-me}
      # V2.3 Relationship Intelligence
      RELATIONSHIP_INTELLIGENCE_ENABLED: ${RELATIONSHIP_INTELLIGENCE_ENABLED:-0}
      # V2.6 Controlled Web：平台总开关（默认关闭；空间还需 owner/admin 单独 opt-in）
      CONTROLLED_WEB_ENABLED: ${CONTROLLED_WEB_ENABLED:-0}
    volumes:
      # 数据卷：/data/db（SQLite+WAL）、/data/uploads、/data/backups 同卷
      - app_data:/data
    networks:
      - frontend
      - backend
    # 优雅停机：先停止接收新连接，给 uvicorn 时间完成在途请求与 lease 释放
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build: ./frontend
    image: familygraph-web:0.1.0
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - frontend
    # 注意：web 不挂载数据卷——nginx 禁止直挂 uploads，附件下载走后端授权端点

  # V2.1 Agent sidecar（B2）：无业务 DB、无 uploads 卷、不暴露端口；
  # 仅在 backend 内部网络可达（FastAPI + 获准 Provider egress）。
  agent:
    build: ./agent
    image: familygraph-agent:0.1.0
    restart: unless-stopped
    depends_on:
      - api
    environment:
      FG_API_BASE_URL: http://api:8000
      AGENT_SERVICE_SECRET: ${AGENT_SERVICE_SECRET:-dev-agent-secret-change-me}
      AGENT_RUNTIME_ENABLED: ${AGENT_RUNTIME_ENABLED:-0}
      HEALTH_PORT: "8080"
      # 本地联调 stub Provider（生产由部署环境覆盖/留空）
      AGENT_PROVIDER_CLOUD_BASE_URL: ${AGENT_PROVIDER_CLOUD_BASE_URL:-}
      AGENT_PROVIDER_CLOUD_MODEL: ${AGENT_PROVIDER_CLOUD_MODEL:-}
      AGENT_PROVIDER_CLOUD_API_KEY: ${AGENT_PROVIDER_CLOUD_API_KEY:-}
      # Provider 密钥占位：正式密钥由 platform_operator 经管理后台注册
      # （secretbox 加密落库，sidecar 经 context 的 secret_ref 对账），此处仅留示例位。
      # PROVIDER_API_KEY: ${PROVIDER_API_KEY:-}
    networks:
      - backend
    # 优雅停机：SIGTERM → worker.stop + health.close；在途 Run 由 FastAPI reaper 回收
    stop_grace_period: 10s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app_data:

networks:
  frontend:
  backend:
