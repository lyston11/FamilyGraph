[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "familygraph-backend"
version = "0.1.0"
description = "FamilyGraph API 后端（FastAPI + SQLAlchemy + SQLite/WAL）"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "SQLAlchemy==2.0.36",
    "alembic==1.14.1",
    "bcrypt==4.2.1",
    "PyJWT==2.10.1",
    "lunar-python==1.3.4",
    "pillow==11.0.0",
    "python-multipart==0.0.20",
    # V2.6 Controlled Web：FastAPI 是唯一 egress 边界，生产代码直接依赖 httpx
    "httpx==0.28.1",
    # V2 数据权利导出：成熟 AEAD envelope（AES-GCM），替代自制 XOR+HMAC
    "cryptography==44.0.2",
    # 人物身份去重：姓名匹配键需繁简归一（纯 Python 映射表，无编译依赖）
    "zhconv==1.4.3",
    # PostgreSQL 驱动（C9 生产切流必需）。
    #
    # 必须是**运行时依赖**而不是 dev 依赖：API 容器以 `alembic upgrade head &&
    # python -m app.serve` 启动，两者都要在 `DATABASE_URL` 指向 PostgreSQL 时
    # 连库。若只装在开发 venv 里，镜像内 `import psycopg` 直接 ModuleNotFoundError，
    # 而该错误在发布脚本里表现为「迁移后容器不 healthy」，很难从症状反推到依赖。
    "psycopg[binary]==3.2.3",
    # Redis 加速层客户端（C5）。
    #
    # 与上面的 psycopg 同类：`redis_accel` 是**生产代码**，且它在 `REDIS_URL`
    # 已配置时会 `import redis`。不声明为运行时依赖的后果不是「功能缺失」而是
    # **崩溃**：`_client_or_none()` 里的 `import redis` 在 try 块之外，因此
    # `ModuleNotFoundError` 不会被「任何后端错误都按不可用降级」的 except 捕获，
    # 而 `available()` 此时仍返回 True（它只看 url 非空），于是调用方以为加速层
    # 健康、随后在读写路径上抛异常。
    #
    # 实测：生产镜像 `familygraph-prod-api-1` 内 `import redis` 直接
    # ModuleNotFoundError（`pip install .` 不含未声明依赖），而本机 venv 因
    # 历史上手工装过而正常——正是「本地过、镜像崩」的形态。
    "redis==8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.6",
    "mypy==1.14.1",
]

[tool.setuptools]
packages = [
    "app",
    "app.api",
    "app.models",
    "app.schemas",
    "app.services",
    "app.utils",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 惯用写法：Depends() 出现在参数默认值
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
strict = true

# zhconv 是纯映射表实现，不带 py.typed；只放宽这一个模块的存根检查。
[[tool.mypy.overrides]]
module = "zhconv.*"
ignore_missing_imports = true
