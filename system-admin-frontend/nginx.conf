# 系统管理员前端静态托管 + /admin-api 反向代理（09-04 子任务 3）
#
# 安全约束：
# - 只代理 /admin-api/ → api:8002（admin listener）；绝不代理家庭 /api 或内部 /internal。
# - 附件原图、存储路径永不经此暴露；敏感详情响应由后端 no-store。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退（vue-router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 家庭 API 前缀显式拒绝：后台前端与家庭 API 无任何关系
    location /api/ {
        return 404;
    }

    # 内部协议前缀显式拒绝外泄（agent internal listener 仅限容器网络）
    location /internal/ {
        return 404;
    }

    # admin API 反向代理：不带 URI 尾缀，保留原始 /admin-api 前缀（后端路由自带前缀）
    location /admin-api/ {
        proxy_pass http://api:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 敏感详情响应由后端标注 no-store；代理层不追加缓存
        proxy_cache off;
    }
}
