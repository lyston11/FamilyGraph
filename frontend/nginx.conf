# FamilyGraph 前端静态托管 + /api 反向代理（m0a）
#
# 安全约束（architecture.md §6/§9）：此处【禁止】直挂 uploads 数据卷。
# 附件下载一律走后端授权端点（鉴权 + 流式返回），防止绕过可见性矩阵。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传体积上限与后端 AD-7 的 10MB 限制保持一致（略留余量防返工）
    client_max_body_size 12m;

    # SPA 路由回退（vue-router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 内部协议前缀显式拒绝外泄（防御纵深：/internal/* 仅限容器网络内可达，
    # agent sidecar 直连 api:8000，不经 nginx）
    location /internal/ {
        return 404;
    }

    # API 反向代理：不带 URI 尾缀，保留原始 /api 前缀（后端路由自带前缀）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Agent Run SSE：禁用缓冲，长连接不超时中断（RT-4）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
